$kind: http-request
description: ""
url: "{{baseUrl}}/inventory/orders"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "999999"
body:
  type: json
  content: |-
    {
      "productId": {{tshirtId}},
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 4000
