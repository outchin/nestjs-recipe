$kind: http-request
description: T-shirt is seeded with 50, max allowed quantity is 100.
url: "{{baseUrl}}/inventory/orders"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "{{bobId}}"
body:
  type: json
  content: |-
    {
      "productId": {{tshirtId}},
      "quantity": 100
    }
scripts:
  - type: afterResponse
    code: pm.test('status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 5000
