$kind: http-request
description: ""
url: "{{baseUrl}}/inventory/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": {{tshirtId}},
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
