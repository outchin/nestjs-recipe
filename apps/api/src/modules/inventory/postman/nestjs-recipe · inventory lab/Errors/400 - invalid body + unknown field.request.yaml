$kind: http-request
description: ""
url: "{{baseUrl}}/inventory/orders"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "{{aliceId}}"
body:
  type: json
  content: |-
    {
      "productId": "abc",
      "quantity": 0,
      "hack": true
