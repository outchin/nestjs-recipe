$kind: http-request
description: "Same as `npm run db:seed:inventory`: orders cleared, sneaker stock 1, T-shirt 50. Makes the Scenario re-runnable."
url: "{{baseUrl}}/inventory/dev/reset"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('sneaker back to 1', () => pm.expect(pm.response.json().find(p => p.sku === 'SNEAKER-LTD-001').stock).to.eql(1));
    language: text/javascript
order: 500
