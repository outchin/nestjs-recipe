$kind: http-request
description: Simulates a double-click / network retry. Body must contain the same key as step 2.
url: "{{baseUrl}}/inventory/orders"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "{{aliceId}}"
body:
  type: json
  content: |-
    {
      "productId": {{sneakerId}},
      "quantity": 1,
      "idempotencyKey": "{{aliceKey}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('same order id returned, nothing bought twice', () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('aliceOrderId'))));
    language: text/javascript
order: 3000
